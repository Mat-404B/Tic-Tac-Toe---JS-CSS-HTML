<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="main">

        <h1>Tic Tac Toe</h1>

        <hr />

        <div class="game">

            <div class="board">
                <button class="itenButton" id="0"></button>
                <button class="itenButton" id="1"></button>
                <button class="itenButton" id="2"></button>

                <button class="itenButton" id="3"></button>
                <button class="itenButton" id="4"></button>
                <button class="itenButton" id="5"></button>

                <button class="itenButton" id="6"></button>
                <button class="itenButton" id="7"></button>
                <button class="itenButton" id="8"></button>

            </div>

            <div class="reset">

                <button id="reset">Reset</button>

            </div>

        </div>


        <hr />

        <h1 id="currentPlayer"></h1>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
